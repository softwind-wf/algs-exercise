# Prometheus 抓取配置：抓取应用的 /actuator/prometheus 指标
# 查询面板：http://localhost:9090（示例查询：up、jvm_memory_used_bytes、http_server_requests_seconds_count）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 大学网站应用（Spring Boot Actuator + Micrometer）
  - job_name: university-web
    metrics_path: /actuator/prometheus
    static_configs:
      # compose 网络内用服务名解析；K8s/其它部署改这里即可
      - targets: ['app:8080']
        labels:
          app: university-web
