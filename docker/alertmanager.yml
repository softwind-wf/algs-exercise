# Alertmanager 路由配置（示例骨架）
# 生产接入告警接收端：在 receivers 下配置 webhook_configs / email_configs
# （钉钉/企业微信机器人通常通过 prometheus-alert-webhook 中转），然后修改 route.receiver。
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # 占位接收器：告警可在 http://localhost:9093 的 Alertmanager UI 查看；
  # 需要真实通知时改成 webhook_configs（url 指向你的机器人/网关）
  - name: default
    webhook_configs: []
