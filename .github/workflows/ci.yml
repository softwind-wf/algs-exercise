name: CI

# 主干与 PR 自动跑全量测试；集成测试用服务容器 MySQL（Flyway 启动时自动建表）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: university
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 连接串指向 127.0.0.1（服务容器映射到宿主机端口），环境变量覆盖 application.yml 默认值
      - name: Run all tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/university?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B clean test

      # 测试失败时上传报告便于定位
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # 主干构建镜像验证 Dockerfile 可构建（不推送，需要推送时接 ghcr/docker hub 凭据）
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: university-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
