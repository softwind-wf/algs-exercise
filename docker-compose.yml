# 大学网站一键部署：MySQL 8 + 应用（Flyway 启动时自动建表灌数）
# 用法：
#   docker compose up -d --build
#   访问 http://localhost:8080 （默认端口可用 APP_PORT 覆盖，如 APP_PORT=8090）
# 初始账号（密码均为 password）：zhang(学生) / katz(教师) / admin(管理员)
services:
  mysql:
    image: mysql:8.0
    container_name: university-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: university
      MYSQL_USER: university
      MYSQL_PASSWORD: university123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 等待 MySQL 完成初始化和建库（SELECT 能成功才算健康），避免应用过早启动导致 Flyway 连接失败
      test: ["CMD-SHELL", "mysql -uroot -proot123 -e 'SELECT 1' university >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    image: university-web:1.0
    container_name: university-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/university?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: university
      DB_PASSWORD: university123
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # 头像文件持久化：容器重建/升级不丢用户上传的头像
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  mysql-data:
  uploads-data: