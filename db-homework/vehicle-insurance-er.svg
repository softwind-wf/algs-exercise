<?xml version="1.0" encoding="UTF-8"?>
<svg id="er" xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420"
     font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <rect x="0" y="0" width="1900" height="1420" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="950" y="54" text-anchor="middle" font-size="30" font-weight="bold" fill="#12314f">车辆保险公司 E-R 图</text>
  <text x="950" y="84" text-anchor="middle" font-size="16" fill="#5a6a7a">实践习题 7.1 &#160;·&#160; 陈氏（Chen）记号：矩形=实体，菱形=联系，椭圆=属性</text>

  <!-- ===== 实体—属性连线（先画，被形状覆盖） ===== -->
  <g stroke="#7d8b99" stroke-width="1.4">
    <line x1="330" y1="330" x2="140" y2="165"/>
    <line x1="330" y1="330" x2="330" y2="130"/>
    <line x1="330" y1="330" x2="520" y2="165"/>
    <line x1="330" y1="330" x2="150" y2="240"/>

    <line x1="950" y1="330" x2="830" y2="175"/>
    <line x1="950" y1="330" x2="950" y2="125"/>
    <line x1="950" y1="330" x2="1070" y2="175"/>

    <line x1="1570" y1="330" x2="1450" y2="175"/>
    <line x1="1570" y1="330" x2="1570" y2="125"/>
    <line x1="1570" y1="330" x2="1690" y2="175"/>
    <line x1="1570" y1="330" x2="1800" y2="240"/>

    <line x1="950" y1="1000" x2="830" y2="1150"/>
    <line x1="950" y1="1000" x2="950" y2="1195"/>
    <line x1="950" y1="1000" x2="1070" y2="1150"/>
    <line x1="950" y1="1000" x2="950" y2="1285"/>

    <line x1="1570" y1="1000" x2="1430" y2="1150"/>
    <line x1="1570" y1="1000" x2="1550" y2="1200"/>
    <line x1="1570" y1="1000" x2="1670" y2="1150"/>
    <line x1="1570" y1="1000" x2="1790" y2="1200"/>
    <line x1="1570" y1="1000" x2="1600" y2="1290"/>
  </g>

  <!-- ===== 联系连线 ===== -->
  <g stroke="#3d4a57" stroke-width="2" stroke-linecap="round">
    <!-- 拥有：客户 1 —— 车辆 N，双方全参与（双线） -->
    <line x1="330" y1="325" x2="640" y2="325"/>
    <line x1="330" y1="335" x2="640" y2="335"/>
    <line x1="640" y1="325" x2="950" y2="325"/>
    <line x1="640" y1="335" x2="950" y2="335"/>
    <!-- 涉及：车辆 M —— 事故 N，车辆部分参与（单线），事故全参与（双线） -->
    <line x1="950" y1="330" x2="1260" y2="330"/>
    <line x1="1260" y1="325" x2="1570" y2="325"/>
    <line x1="1260" y1="335" x2="1570" y2="335"/>
    <!-- 承保：车辆 M —— 保险单 N，车辆部分参与（单线），保险单全参与（双线） -->
    <line x1="950" y1="330" x2="950" y2="665"/>
    <line x1="945" y1="665" x2="945" y2="1000"/>
    <line x1="955" y1="665" x2="955" y2="1000"/>
    <!-- 缴费（标识联系）：保险单 1 —— 支付 N，双方全参与（双线） -->
    <line x1="950" y1="995" x2="1260" y2="995"/>
    <line x1="950" y1="1005" x2="1260" y2="1005"/>
    <line x1="1260" y1="995" x2="1570" y2="995"/>
    <line x1="1260" y1="1005" x2="1570" y2="1005"/>
  </g>

  <!-- ===== 基数标注 ===== -->
  <g font-size="19" font-weight="bold" fill="#b00020" text-anchor="middle">
    <text x="492" y="314">1</text>
    <text x="787" y="314">N</text>
    <text x="1112" y="314">M</text>
    <text x="1407" y="314">N</text>
    <text x="1112" y="984">1</text>
    <text x="1407" y="984">N</text>
  </g>
  <g font-size="19" font-weight="bold" fill="#b00020" text-anchor="start">
    <text x="972" y="500">M</text>
    <text x="972" y="850">N</text>
  </g>

  <!-- ===== 联系（菱形） ===== -->
  <g stroke-width="2.2">
    <polygon points="640,282 715,330 640,378 565,330" fill="#fdf0d0" stroke="#b07d00"/>
    <polygon points="1260,282 1335,330 1260,378 1185,330" fill="#fdf0d0" stroke="#b07d00"/>
    <polygon points="950,615 1030,665 950,715 870,665" fill="#fdf0d0" stroke="#b07d00"/>
    <!-- 标识联系：双菱形 -->
    <polygon points="1260,952 1335,1000 1260,1048 1185,1000" fill="#f8e3b0" stroke="#8a5a00"/>
    <polygon points="1260,960 1325,1000 1260,1040 1195,1000" fill="#f8e3b0" stroke="#8a5a00"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#6b4a00" text-anchor="middle">
    <text x="640" y="337">拥有</text>
    <text x="1260" y="337">涉及</text>
    <text x="950" y="672">承保</text>
    <text x="1260" y="1007">缴费</text>
  </g>

  <!-- ===== 实体（矩形） ===== -->
  <g stroke-width="2.2">
    <rect x="240" y="294" width="180" height="72" rx="6" fill="#dbe9f7" stroke="#1f4e79"/>
    <rect x="860" y="294" width="180" height="72" rx="6" fill="#dbe9f7" stroke="#1f4e79"/>
    <rect x="1480" y="294" width="180" height="72" rx="6" fill="#dbe9f7" stroke="#1f4e79"/>
    <rect x="860" y="964" width="180" height="72" rx="6" fill="#dbe9f7" stroke="#1f4e79"/>
    <!-- 弱实体：双矩形 -->
    <rect x="1480" y="964" width="180" height="72" rx="6" fill="#e6e0f5" stroke="#4b3b8f"/>
    <rect x="1489" y="973" width="162" height="54" rx="4" fill="#e6e0f5" stroke="#4b3b8f"/>
  </g>
  <g font-size="21" font-weight="bold" fill="#12314f" text-anchor="middle">
    <text x="330" y="338">客户</text>
    <text x="950" y="338">车辆</text>
    <text x="1570" y="338">事故</text>
    <text x="950" y="1008">保险单</text>
  </g>
  <g font-size="21" font-weight="bold" fill="#33246b" text-anchor="middle">
    <text x="1570" y="1008">支付</text>
  </g>

  <!-- ===== 属性（椭圆） ===== -->
  <g fill="#eaf6ec" stroke="#3f7d4f" stroke-width="1.6">
    <!-- 客户 -->
    <ellipse cx="140" cy="165" rx="60" ry="26"/>
    <ellipse cx="330" cy="130" rx="60" ry="26"/>
    <ellipse cx="520" cy="165" rx="60" ry="26"/>
    <ellipse cx="150" cy="240" rx="60" ry="26"/>
    <!-- 车辆 -->
    <ellipse cx="830" cy="175" rx="60" ry="26"/>
    <ellipse cx="950" cy="125" rx="60" ry="26"/>
    <ellipse cx="1070" cy="175" rx="60" ry="26"/>
    <!-- 事故 -->
    <ellipse cx="1450" cy="175" rx="60" ry="26"/>
    <ellipse cx="1570" cy="125" rx="60" ry="26"/>
    <ellipse cx="1690" cy="175" rx="60" ry="26"/>
    <ellipse cx="1800" cy="240" rx="62" ry="26"/>
    <!-- 保险单 -->
    <ellipse cx="830" cy="1150" rx="60" ry="26"/>
    <ellipse cx="950" cy="1195" rx="60" ry="26"/>
    <ellipse cx="1070" cy="1150" rx="60" ry="26"/>
    <ellipse cx="950" cy="1285" rx="62" ry="26"/>
    <!-- 支付 -->
    <ellipse cx="1430" cy="1150" rx="62" ry="26"/>
    <ellipse cx="1550" cy="1200" rx="60" ry="26"/>
    <ellipse cx="1670" cy="1150" rx="60" ry="26"/>
    <ellipse cx="1790" cy="1200" rx="60" ry="26"/>
    <ellipse cx="1600" cy="1290" rx="74" ry="26"/>
  </g>

  <!-- 属性文字 -->
  <g font-size="16" fill="#1c3b26" text-anchor="middle">
    <text x="140" y="171">客户号</text>
    <text x="330" y="136">姓名</text>
    <text x="520" y="171">联系电话</text>
    <text x="150" y="246">地址</text>

    <text x="830" y="181">车牌号</text>
    <text x="950" y="131">车型</text>
    <text x="1070" y="181">出厂年份</text>

    <text x="1450" y="181">事故号</text>
    <text x="1570" y="131">发生日期</text>
    <text x="1690" y="181">事故地点</text>
    <text x="1800" y="246">损失金额</text>

    <text x="830" y="1156">保单号</text>
    <text x="950" y="1201">险种</text>
    <text x="1070" y="1156">保额</text>
    <text x="950" y="1291">起止日期</text>

    <text x="1430" y="1156">支付序号</text>
    <text x="1550" y="1206">到期日</text>
    <text x="1670" y="1156">缴费日</text>
    <text x="1790" y="1206">金额</text>
    <text x="1600" y="1296">缴费时间段</text>
  </g>

  <!-- 主键下划线 -->
  <g stroke="#1c3b26" stroke-width="1.7">
    <line x1="117" y1="180" x2="163" y2="180"/>
    <line x1="807" y1="190" x2="853" y2="190"/>
    <line x1="1427" y1="190" x2="1473" y2="190"/>
    <line x1="807" y1="1165" x2="853" y2="1165"/>
  </g>
  <!-- 弱实体部分键：虚线 -->
  <line x1="1398" y1="1165" x2="1462" y2="1165" stroke="#1c3b26" stroke-width="1.7" stroke-dasharray="6 4"/>

  <!-- ===== 图例 ===== -->
  <rect x="70" y="720" width="580" height="560" rx="10" fill="#fbfcfe" stroke="#9fb0c0" stroke-width="1.5"/>
  <text x="100" y="762" font-size="19" font-weight="bold" fill="#12314f">图 例</text>
  <g stroke-width="1.8">
    <rect x="100" y="786" width="52" height="30" rx="4" fill="#dbe9f7" stroke="#1f4e79"/>
    <rect x="100" y="842" width="52" height="30" rx="4" fill="#e6e0f5" stroke="#4b3b8f"/>
    <rect x="105" y="847" width="42" height="20" rx="3" fill="none" stroke="#4b3b8f"/>
    <polygon points="126,904 152,922 126,940 100,922" fill="#fdf0d0" stroke="#b07d00"/>
    <polygon points="126,962 152,980 126,998 100,980" fill="#f8e3b0" stroke="#8a5a00"/>
    <polygon points="126,968 145,980 126,992 107,980" fill="none" stroke="#8a5a00"/>
    <ellipse cx="126" cy="1046" rx="26" ry="15" fill="#eaf6ec" stroke="#3f7d4f"/>
    <line x1="100" y1="1104" x2="152" y2="1104" stroke="#2b2b2b"/>
    <line x1="124" y1="1118" x2="124" y2="1130" stroke="#2b2b2b" stroke-dasharray="5 4"/>
    <line x1="100" y1="1170" x2="152" y2="1170" stroke="#2b2b2b"/>
    <line x1="100" y1="1178" x2="152" y2="1178" stroke="#2b2b2b"/>
    <line x1="100" y1="1232" x2="152" y2="1232" stroke="#2b2b2b"/>
  </g>
  <g font-size="16.5" fill="#24303c">
    <text x="176" y="807">矩形：实体</text>
    <text x="176" y="863">双矩形：弱实体</text>
    <text x="176" y="933">菱形：联系</text>
    <text x="176" y="991">双菱形：标识联系</text>
    <text x="176" y="1052">椭圆：属性</text>
    <text x="176" y="1110">下划线：主键属性；虚线：部分键</text>
    <text x="176" y="1178">双线：完全参与（每个实例都必须参与）</text>
    <text x="176" y="1240">单线：部分参与</text>
  </g>
  <text x="100" y="1268" font-size="16.5" fill="#b00020" font-weight="bold">1 / M / N：联系两端的基数</text>
</svg>