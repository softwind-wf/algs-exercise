# ============================================================
# university 站点：Nginx 终结 TLS，后端 Spring Boot 跑在 127.0.0.1:8080
#
# 放到 /etc/nginx/conf.d/university.conf，改三处：
#   1) server_name 和证书路径里的域名
#   2) 证书路径（certbot 默认在 /etc/letsencrypt/live/<域名>/）
#   3) 后端地址（默认 127.0.0.1:8080；Docker 里跑应用时改成 app:8080）
#
# 必须用 fullchain.pem（叶子 + 中间证书）。只配叶子证书时，部分客户端会报
#   PKIX path building failed: unable to find valid certification path
# 因为"中间证书"这一环没人发。
#
# 改完先 `nginx -t` 再 reload：配置错误会让整站 443 直接不可用。
# ============================================================

# WebSocket 升级头（聊天功能用）。map 必须放在 http 上下文，所以写在本文件顶部。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：只留 ACME 验证目录，其余一律 301 到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name university.example.edu.cn;

    # certbot 续期的 HTTP-01 验证文件落在这里，不能被 301 掉
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # nginx 1.25.1+ 会警告 listen 里的 http2 参数已废弃，那时改成：
    #   listen 443 ssl;  listen [::]:443 ssl;  http2 on;
    server_name university.example.edu.cn;

    ssl_certificate     /etc/letsencrypt/live/university.example.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/university.example.edu.cn/privkey.pem;

    # 只留 TLS 1.2/1.3；TLS 1.0/1.1 已被主流浏览器判定不安全
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与 application.yml 的 multipart 上限对齐：单文件 5MB / 单请求 6MB
    client_max_body_size 6m;

    # 安全响应头。HSTS 等全站 HTTPS 稳定后再开；不要轻易加 includeSubDomains
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;

    # WebSocket（聊天）：Upgrade / Connection 必须透传，读超时要拉长，否则长连接会被掐
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Actuator 只给本机/内网抓。Prometheus 在别的机器上时改成 allow <网段>;
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
