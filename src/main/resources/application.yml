server:
  port: 8080
  servlet:
    session:
      # 会话 30 分钟无操作过期，降低会话被长期盗用的风险
      timeout: 30m
      cookie:
        # JSESSIONID 禁止 JS 读取，防 XSS 窃取会话
        http-only: true
        # Lax：跨站顶级导航可携带、跨站子请求不携带，兼顾可用性与 CSRF 防护
        same-site: lax

spring:
  application:
    name: university-web
  profiles:
    # 未显式指定 profile 时默认走 dev（模板缓存关闭、SQL 日志 debug）；
    # 生产环境用 --spring.profiles.active=prod 启动
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/university?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  flyway:
    # schema 版本化管理：脚本在 classpath:db/migration（V1 业务表 / V2 账号权限 / V3 审计日志），
    # 应用启动时自动迁移，替代手工执行 SQL，线上升级不再靠人肉脚本
    enabled: true
    encoding: UTF-8
    # 存量库（已有表、无 flyway_schema_history 表）自动打基线后再补跑迁移；
    # baseline-version=0 保证 V1 起全部执行，脚本均为幂等写法（IF NOT EXISTS / INSERT IGNORE），重放安全
    baseline-on-migrate: true
    baseline-version: 0
    # 已应用迁移的脚本内容被篡改时启动即失败，防止版本漂移
    validate-on-migrate: true
  thymeleaf:
    encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/university/*.xml
  type-aliases-package: com.ds.university.entity
  configuration:
    map-underscore-to-camel-case: true

# ============================================================
# 运维：Actuator 健康检查与监控指标
#   /actuator/health            —— 存活探针（含 db 检查），供 Docker/K8s/负载均衡探活
#   /actuator/health/liveness   —— 存活状态（K8s livenessProbe）
#   /actuator/health/readiness  —— 就绪状态（K8s readinessProbe）
#   /actuator/prometheus        —— Prometheus 格式指标，供监控告警栈抓取
# 仅暴露以上端点，其余（env/beans 等敏感端点）默认不对外；
# 生产环境建议用防火墙/内网隔离 8080 的 /actuator 路径。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
