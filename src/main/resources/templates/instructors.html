<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('教师列表')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <h1 class="page-title">教师列表</h1>

    <form method="get" th:action="@{/instructors}" class="filter-card p-3 mt-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label mb-1" for="deptName">院系</label>
                <select class="form-select" id="deptName" name="deptName">
                    <option value="">全部</option>
                    <option th:each="d : ${departments}" th:value="${d.deptName}"
                            th:selected="${deptName == d.deptName}" th:text="${d.deptName}">系</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">查询</button>
            </div>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-6 col-lg-3" th:each="i : ${instructors.records}">
            <a class="instructor-card" th:href="@{/instructors/{id}(id=${i.id})}">
                <div class="instructor-avatar" th:text="${#strings.substring(i.name, 0, 1)}">首字母</div>
                <h2 class="instructor-name" th:text="${i.name}">姓名</h2>
                <p class="instructor-id" th:text="'编号 ' + ${i.id}">编号</p>
                <div class="instructor-meta">
                    <span th:text="${i.deptName}">系</span>
                    <span th:text="'$' + ${#numbers.formatInteger(i.salary, 0, 'COMMA')}">工资</span>
                </div>
            </a>
        </div>
    </div>
    <p class="hint mt-3" th:if="${#lists.isEmpty(instructors.records)}">没有符合条件的教师。</p>

    <div class="d-flex flex-wrap align-items-center justify-content-between mt-3 gap-2">
        <p class="hint mb-0" th:if="${instructors.total > 0}">
            共 <span th:text="${instructors.total}">0</span> 条，第 <span th:text="${instructors.page}">1</span> / <span th:text="${instructors.totalPages}">1</span> 页
        </p>
        <nav th:if="${instructors.totalPages > 1}" aria-label="分页">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!instructors.hasPrev} ? 'disabled'">
                    <a class="page-link" th:href="@{/instructors(page=${instructors.prevPage}, deptName=${deptName})}">上一页</a>
                </li>
                <li class="page-item" th:each="n : ${instructors.pageNumbers}"
                    th:classappend="${n == 0 ? 'disabled' : (n == instructors.page ? 'active' : '')}">
                    <span class="page-link" th:if="${n == 0}">…</span>
                    <a class="page-link" th:unless="${n == 0}"
                       th:href="@{/instructors(page=${n}, deptName=${deptName})}"
                       th:text="${n}">1</a>
                </li>
                <li class="page-item" th:classappend="${!instructors.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{/instructors(page=${instructors.nextPage}, deptName=${deptName})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
