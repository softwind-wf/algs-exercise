<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('课程列表')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <h1 class="page-title">课程列表</h1>

    <form method="get" th:action="@{/courses}" class="filter-card p-3 mt-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label mb-1" for="deptName">院系</label>
                <select class="form-select" id="deptName" name="deptName">
                    <option value="">全部</option>
                    <option th:each="d : ${departments}" th:value="${d.deptName}"
                            th:selected="${deptName == d.deptName}" th:text="${d.deptName}">系</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label mb-1" for="keyword">关键字</label>
                <input class="form-control" type="text" id="keyword" name="keyword"
                       th:value="${keyword}" placeholder="课程号 / 课程名">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">查询</button>
            </div>
        </div>
    </form>

    <div class="table-responsive bg-white border rounded-3 shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>课程号</th><th>课程名</th><th>所属系</th><th class="text-end">学分</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${courses.records}">
                <td><a th:href="@{/courses/{id}(id=${c.courseId})}" th:text="${c.courseId}">课程号</a></td>
                <td th:text="${c.title}">课程名</td>
                <td><a th:href="@{/departments/{name}(name=${c.deptName})}" th:text="${c.deptName}">系</a></td>
                <td class="text-end" th:text="${c.credits}">学分</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="hint mt-2" th:if="${#lists.isEmpty(courses.records)}">没有符合条件的课程。</p>

    <div class="d-flex flex-wrap align-items-center justify-content-between mt-3 gap-2">
        <p class="hint mb-0" th:if="${courses.total > 0}">
            共 <span th:text="${courses.total}">0</span> 条，第 <span th:text="${courses.page}">1</span> / <span th:text="${courses.totalPages}">1</span> 页
        </p>
        <nav th:if="${courses.totalPages > 1}" aria-label="分页">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!courses.hasPrev} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${courses.prevPage}, deptName=${deptName}, keyword=${keyword})}">上一页</a>
                </li>
                <li class="page-item" th:each="n : ${courses.pageNumbers}"
                    th:classappend="${n == 0 ? 'disabled' : (n == courses.page ? 'active' : '')}">
                    <span class="page-link" th:if="${n == 0}">…</span>
                    <a class="page-link" th:unless="${n == 0}"
                       th:href="@{/courses(page=${n}, deptName=${deptName}, keyword=${keyword})}"
                       th:text="${n}">1</a>
                </li>
                <li class="page-item" th:classappend="${!courses.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${courses.nextPage}, deptName=${deptName}, keyword=${keyword})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
