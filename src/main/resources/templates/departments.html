<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('院系概览')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="d-flex align-items-end justify-content-between flex-wrap gap-2">
        <div>
            <h1 class="page-title mb-1">院系概览</h1>
            <p class="text-secondary mb-0">走进各院系，了解学科方向、师资力量与课程设置</p>
        </div>
    </div>

    <div class="row g-4 mt-2 mb-4">
        <div class="col-md-6 col-lg-4" th:each="d : ${departments.records}">
            <a class="dept-card" th:href="@{/departments/{name}(name=${d.deptName})}">
                <div class="dept-card-media">
                    <img th:src="@{/images/depts/{slug}.jpg(slug=${#strings.replace(#strings.replace(d.deptName, '.', ''), ' ', '')})}"
                         th:alt="${d.deptName}" loading="lazy">
                    <div class="dept-card-overlay">
                        <span class="dept-card-building">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M13 21V11l6 4v6"/></svg>
                            <span th:text="${d.building}">教学楼</span>
                        </span>
                    </div>
                </div>
                <div class="dept-card-body">
                    <h2 class="dept-card-name" th:text="${d.deptName}">院系名</h2>
                    <p class="dept-card-desc" th:switch="${d.deptName}">
                        <span th:case="'Biology'">探索生命奥秘，涵盖遗传学、计算生物学等前沿方向。</span>
                        <span th:case="'Comp. Sci.'">以算法与数据结构为核心，培养软件工程与人工智能人才。</span>
                        <span th:case="'Elec. Eng.'">聚焦电路、信号与嵌入式系统，面向智能硬件与能源控制。</span>
                        <span th:case="'Finance'">研究金融市场与投资管理，打造金融分析与风险管理能力。</span>
                        <span th:case="'History'">以史为鉴、贯通中外，培养人文素养与历史思辨精神。</span>
                        <span th:case="'Music'">声乐与器乐并重，融合传统与现代的音乐创作与表演。</span>
                        <span th:case="'Physics'">探索物质与能量的基本规律，从经典力学到量子世界。</span>
                        <span th:case="*">注重基础与交叉，培养扎实的学科素养与创新能力。</span>
                    </p>
                    <div class="dept-card-meta">
                        <span th:text="'教师 ' + ${d.teacherCount}">教师 0</span>
                        <span th:text="'课程 ' + ${d.courseCount}">课程 0</span>
                        <span th:text="'预算 $' + ${#numbers.formatInteger(d.budget, 0, 'COMMA')}">预算 $0</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
        <p class="hint mb-0" th:if="${departments.total > 0}">
            共 <span th:text="${departments.total}">0</span> 个院系
        </p>
        <nav th:if="${departments.totalPages > 1}" aria-label="分页">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!departments.hasPrev} ? 'disabled'">
                    <a class="page-link" th:href="@{/departments(page=${departments.prevPage})}">上一页</a>
                </li>
                <li class="page-item" th:each="n : ${departments.pageNumbers}"
                    th:classappend="${n == 0 ? 'disabled' : (n == departments.page ? 'active' : '')}">
                    <span class="page-link" th:if="${n == 0}">…</span>
                    <a class="page-link" th:unless="${n == 0}"
                       th:href="@{/departments(page=${n})}"
                       th:text="${n}">1</a>
                </li>
                <li class="page-item" th:classappend="${!departments.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{/departments(page=${departments.nextPage})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
