<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('系详情')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <h1 class="page-title" th:text="${detail.department.deptName}">系名</h1>
    <p class="text-secondary">教学楼：<span th:text="${detail.department.building}">楼</span> ·
       预算：<span th:text="${detail.department.budget}">预算</span></p>

    <h2 class="h5 mt-4">教师（<span th:text="${detail.instructors.size()}">0</span>）</h2>
    <div class="table-responsive bg-white border rounded-3 shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>编号</th><th>姓名</th><th class="text-end">工资</th></tr>
            </thead>
            <tbody>
            <tr th:each="i : ${detail.instructors}">
                <td><a th:href="@{/instructors/{id}(id=${i.id})}" th:text="${i.id}">编号</a></td>
                <td th:text="${i.name}">姓名</td>
                <td class="text-end" th:text="${i.salary}">工资</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 class="h5 mt-4">课程（<span th:text="${detail.courses.size()}">0</span>）</h2>
    <div class="table-responsive bg-white border rounded-3 shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>课程号</th><th>课程名</th><th class="text-end">学分</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${detail.courses}">
                <td><a th:href="@{/courses/{id}(id=${c.courseId})}" th:text="${c.courseId}">课程号</a></td>
                <td th:text="${c.title}">课程名</td>
                <td class="text-end" th:text="${c.credits}">学分</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
