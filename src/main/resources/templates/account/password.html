<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('修改密码')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="card login-card shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-4">修改密码</h1>
            <div class="alert alert-success py-2" th:if="${success}" th:text="${success}">成功提示</div>
            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}">错误提示</div>
            <form method="post" th:action="@{/account/password}">
                <div class="mb-3">
                    <label class="form-label" for="oldPassword">原密码</label>
                    <input class="form-control" type="password" id="oldPassword" name="oldPassword" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">新密码</label>
                    <input class="form-control" type="password" id="newPassword" name="newPassword" required minlength="6" maxlength="32">
                    <div class="form-text">长度 6~32 位，不能与原密码相同。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">确认新密码</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required minlength="6" maxlength="32">
                </div>
                <button type="submit" class="btn btn-primary w-100">保存新密码</button>
            </form>
            <p class="text-center mt-3 mb-0"><a th:href="@{/}">返回首页</a></p>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
