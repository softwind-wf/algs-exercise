<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('出错了')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="card login-card shadow-sm mt-5">
        <div class="card-body p-4 text-center">
            <div class="error-icon mb-3">!</div>
            <h1 class="h4 mb-3">出错了</h1>
            <div class="alert alert-danger py-2 text-start" th:if="${message}" th:text="${message}">错误信息</div>
            <p class="text-muted mb-3" th:unless="${message}" th:text="${error ?: '页面不存在或发生未知错误'}">错误信息</p>
            <a class="btn btn-primary" th:href="@{/}">返回首页</a>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
