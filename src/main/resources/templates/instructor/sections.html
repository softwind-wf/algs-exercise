<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('授课列表')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1 class="page-title mb-0">授课列表</h1>
        <div class="btn-group btn-group-sm" role="group" aria-label="教师中心导航">
            <a class="btn btn-outline-primary" th:href="@{/instructor}">首页</a>
            <a class="btn btn-primary" th:href="@{/instructor/sections}">授课列表</a>
        </div>
    </div>

    <p class="text-secondary mt-2 mb-0">
        教师：<span th:text="${dashboard.instructor.name}">教师姓名</span> ·
        工号：<span th:text="${dashboard.instructor.id}">工号</span>
    </p>

    <div class="table-responsive bg-white border rounded-3 shadow-sm mt-3">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>课程</th><th>开课号</th><th>学期</th><th>年份</th><th>教室</th><th>时间段</th><th class="text-end">选课/容量</th><th class="text-end">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${dashboard.sections}">
                <td>
                    <a th:href="@{/courses/{id}(id=${s.courseId})}" th:text="${s.courseId}">课程号</a>
                    <span class="dim" th:text="${s.courseTitle}">课程名</span>
                </td>
                <td th:text="${s.secId}">开课号</td>
                <td th:text="${s.semester}">学期</td>
                <td th:text="${s.year}">年份</td>
                <td th:text="${s.building + ' ' + s.roomNumber}">教室</td>
                <td th:text="${s.timeSlotId}">时间段</td>
                <td class="text-end" th:text="${s.enrolled} + '/' + ${s.capacity}">选课/容量</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/instructor/roster(courseId=${s.courseId}, secId=${s.secId}, semester=${s.semester}, year=${s.year})}">班级名单</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="hint mt-2" th:if="${#lists.isEmpty(dashboard.sections)}">当前没有授课开课班。</p>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
