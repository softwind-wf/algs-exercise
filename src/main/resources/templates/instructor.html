<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('教师详情')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="detail-hero mt-3">
        <img th:src="@{/images/depts/{slug}.jpg(slug=${#strings.replace(#strings.replace(detail.instructor.deptName, '.', ''), ' ', '')})}"
             th:alt="${detail.instructor.name}">
        <div class="detail-hero-overlay">
            <div class="d-flex align-items-center gap-3">
                <div class="detail-avatar" th:text="${#strings.substring(detail.instructor.name, 0, 1)}">首字母</div>
                <div>
                    <h1 th:text="${detail.instructor.name}">教师名</h1>
                    <div class="detail-hero-meta">
                        <span th:text="'编号 ' + ${detail.instructor.id}">编号</span>
                        <span th:text="${detail.instructor.deptName}">系</span>
                        <span th:text="'$' + ${#numbers.formatInteger(detail.instructor.salary, 0, 'COMMA')}">工资</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h2 class="h5 mt-4">授课开课班（<span th:text="${detail.sections.size()}">0</span>）</h2>
    <div class="row g-4">
        <div class="col-md-6" th:each="s : ${detail.sections}">
            <a class="list-card" th:href="@{/sections/{courseId}/{secId}/{semester}/{year}(courseId=${s.courseId}, secId=${s.secId}, semester=${s.semester}, year=${s.year})}">
                <div class="list-card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                        <h3 class="list-card-title mb-0" th:text="${s.courseTitle}">课程名</h3>
                        <span class="section-term" th:text="${s.year} + ' ' + ${s.semester}">学期</span>
                    </div>
                    <p class="list-card-sub mb-2" th:text="${s.courseId} + ' · 开课号 ' + ${s.secId}">课程号</p>
                    <div class="list-card-meta mb-3">
                        <span th:text="'教室 ' + ${s.building + ' ' + s.roomNumber}">教室</span>
                        <span th:text="'时段 ' + ${s.timeSlotId}">时段</span>
                    </div>
                    <div class="enroll-bar">
                        <div class="enroll-bar-track">
                            <div class="enroll-bar-fill"
                                 th:style="${'width:' + ((s.capacity != null and s.capacity > 0 and s.enrolled != null) ? (s.enrolled * 100 / s.capacity) : 0) + '%'}"></div>
                        </div>
                        <span class="enroll-text" th:text="${s.enrolled} + ' / ' + ${s.capacity} + ' 人'">选课</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <p class="hint" th:if="${#lists.isEmpty(detail.sections)}">暂无授课记录。</p>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
