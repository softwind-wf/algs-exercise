<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('院系管理')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container-fluid admin-shell px-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <aside th:replace="admin/_fragments :: adminNav('departments')"></aside>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="admin-content p-4">
                <h1 class="page-title">院系管理</h1>
                <p class="text-secondary">维护院系名称、教学楼与预算</p>

                <div class="alert alert-success py-2 mt-3" th:if="${success}" th:text="${success}">成功提示</div>
                <div class="alert alert-danger py-2 mt-3" th:if="${error}" th:text="${error}">错误提示</div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h2 class="h5" th:text="${editDept != null} ? '编辑院系' : '新增院系'">新增院系</h2>
                        <form method="post" th:action="@{${editDept != null} ? '/admin/departments/update' : '/admin/departments'}">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="deptName">院系名称</label>
                                    <input class="form-control" type="text" id="deptName" name="deptName"
                                           th:value="${editDept != null} ? ${editDept.deptName}"
                                           th:readonly="${editDept != null}" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="building">教学楼</label>
                                    <input class="form-control" type="text" id="building" name="building"
                                           th:value="${editDept != null} ? ${editDept.building}" placeholder="如：Watson">
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="budget">预算</label>
                                    <input class="form-control" type="number" step="0.01" id="budget" name="budget"
                                           th:value="${editDept != null} ? ${editDept.budget}">
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="${editDept != null} ? '保存修改' : '创建'">创建</button>
                                    <a class="btn btn-outline-secondary" th:if="${editDept != null}"
                                       th:href="@{/admin/departments}">取消</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive bg-white border rounded-3 shadow-sm mt-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>院系名称</th><th>教学楼</th><th class="text-end">预算</th><th class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${departments}">
                            <td th:text="${d.deptName}">院系</td>
                            <td th:text="${d.building}">楼</td>
                            <td class="text-end" th:text="${d.budget}">预算</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/admin/departments(edit=${d.deptName})}">编辑</a>
                                <form class="d-inline" method="post" th:action="@{/admin/departments/delete}"
                                      onsubmit="return confirm('确定删除该院系吗？');">
                                    <input type="hidden" name="deptName" th:value="${d.deptName}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="hint mt-2" th:if="${#lists.isEmpty(departments)}">暂无院系，请先新增。</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
