<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('课程管理')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container-fluid admin-shell px-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <aside th:replace="admin/_fragments :: adminNav('courses')"></aside>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="admin-content p-4">
                <h1 class="page-title">课程管理</h1>
                <p class="text-secondary">维护课程号、课程名、所属院系与学分</p>

                <div class="alert alert-success py-2 mt-3" th:if="${success}" th:text="${success}">成功提示</div>
                <div class="alert alert-danger py-2 mt-3" th:if="${error}" th:text="${error}">错误提示</div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h2 class="h5" th:text="${editCourse != null} ? '编辑课程' : '新增课程'">新增课程</h2>
                        <form method="post" th:action="@{${editCourse != null} ? '/admin/courses/update' : '/admin/courses'}">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="courseId">课程号</label>
                                    <input class="form-control" type="text" id="courseId" name="courseId" maxlength="8"
                                           th:value="${editCourse != null} ? ${editCourse.courseId}"
                                           th:readonly="${editCourse != null}" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="title">课程名</label>
                                    <input class="form-control" type="text" id="title" name="title"
                                           th:value="${editCourse != null} ? ${editCourse.title}" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="deptName">所属院系</label>
                                    <select class="form-select" id="deptName" name="deptName">
                                        <option th:each="d : ${departments}" th:value="${d.deptName}"
                                                th:text="${d.deptName}"
                                                th:selected="${editCourse != null and editCourse.deptName == d.deptName}">院系</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="credits">学分</label>
                                    <input class="form-control" type="number" step="0.5" min="0.5" id="credits" name="credits"
                                           th:value="${editCourse != null} ? ${editCourse.credits}" required>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="${editCourse != null} ? '保存修改' : '创建'">创建</button>
                                    <a class="btn btn-outline-secondary" th:if="${editCourse != null}"
                                       th:href="@{/admin/courses}">取消</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive bg-white border rounded-3 shadow-sm mt-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>课程号</th><th>课程名</th><th>所属院系</th><th class="text-end">学分</th><th class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${courses}">
                            <td th:text="${c.courseId}">课程号</td>
                            <td th:text="${c.title}">课程名</td>
                            <td th:text="${c.deptName}">院系</td>
                            <td class="text-end" th:text="${c.credits}">学分</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/admin/courses(edit=${c.courseId})}">编辑</a>
                                <form class="d-inline" method="post" th:action="@{/admin/courses/delete}"
                                      onsubmit="return confirm('确定删除该课程吗？');">
                                    <input type="hidden" name="courseId" th:value="${c.courseId}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="hint mt-2" th:if="${#lists.isEmpty(courses)}">暂无课程，请先新增。</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
