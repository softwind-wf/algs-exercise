<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('账号管理')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container-fluid admin-shell px-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <aside th:replace="admin/_fragments :: adminNav('accounts')"></aside>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="admin-content p-4">
                <h1 class="page-title">账号管理</h1>
                <p class="text-secondary">新建学生/教师时会自动生成登录账号（账号 = 学号/工号），也可在此手动开户、重置密码、启用或禁用账号。初始密码默认为
                    <code th:text="${defaultPassword}">password</code>。</p>

                <div class="alert alert-success py-2 mt-3" th:if="${success}" th:text="${success}">成功提示</div>
                <div class="alert alert-danger py-2 mt-3" th:if="${error}" th:text="${error}">错误提示</div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <h2 class="h5 mb-0">新建账号</h2>
                            <form method="post" th:action="@{/admin/accounts/open-all}"
                                  onsubmit="return confirm('将为所有未开户的学生和教师自动开户（账号=学号/工号，初始密码=password），确认吗？');">
                                <button type="submit" class="btn btn-sm btn-outline-primary">一键为所有未开户人员开户</button>
                            </form>
                        </div>
                        <form method="post" th:action="@{/admin/accounts}">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="userType">类型</label>
                                    <select class="form-select" id="userType" name="userType" onchange="toggleType()">
                                        <option value="STUDENT" selected>学生</option>
                                        <option value="INSTRUCTOR">教师</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="refIdStudent">未开户学生</label>
                                    <select class="form-select" id="refIdStudent" name="refId">
                                        <option th:each="s : ${students}" th:value="${s.id}"
                                                th:text="${s.id} + ' · ' + ${s.name} + ' · ' + ${s.deptName}">学生</option>
                                    </select>
                                    <select class="form-select" id="refIdInstructor" name="refId" style="display:none" disabled>
                                        <option th:each="i : ${instructors}" th:value="${i.id}"
                                                th:text="${i.id} + ' · ' + ${i.name} + ' · ' + ${i.deptName}">教师</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="userId">登录账号</label>
                                    <input class="form-control" type="text" id="userId" name="userId" maxlength="20"
                                           placeholder="如 zhang" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="password">初始密码</label>
                                    <input class="form-control" type="text" id="password" name="password"
                                           maxlength="32" th:value="${defaultPassword}">
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary">创建账号</button>
                                </div>
                            </div>
                        </form>
                        <p class="hint mt-2" th:if="${#lists.isEmpty(students)}">所有学生均已开户。</p>
                        <p class="hint mt-2" th:if="${#lists.isEmpty(instructors)}">所有教师均已开户。</p>
                    </div>
                </div>

                <div class="table-responsive bg-white border rounded-3 shadow-sm mt-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>登录账号</th>
                            <th>类型</th>
                            <th>关联人员</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${accounts}">
                            <td th:text="${a.userId}">账号</td>
                            <td>
                                <span th:switch="${a.userType}">
                                    <span th:case="'STUDENT'">学生</span>
                                    <span th:case="'INSTRUCTOR'">教师</span>
                                    <span th:case="'ADMIN'">管理员</span>
                                </span>
                            </td>
                            <td>
                                <span th:text="${a.refName}">姓名</span>
                                <small class="text-secondary" th:if="${a.refInfo != null}"
                                       th:text="'（' + ${a.refInfo} + '）'">信息</small>
                            </td>
                            <td>
                                <span class="badge text-bg-secondary me-1" th:each="r : ${a.roles}" th:text="${r}">角色</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${a.enabled == 1} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${a.enabled == 1} ? '启用' : '禁用'">状态</span>
                            </td>
                            <td class="text-secondary" th:text="${a.createTimeText}">时间</td>
                            <td class="text-end">
                                <form class="d-inline" method="post" th:action="@{/admin/accounts/reset}"
                                      onsubmit="return confirm('确定将该账号密码重置为默认密码吗？');">
                                    <input type="hidden" name="userId" th:value="${a.userId}">
                                    <input type="hidden" name="password" th:value="${defaultPassword}">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary"
                                            th:disabled="${a.userType == 'ADMIN'}">重置密码</button>
                                </form>
                                <form class="d-inline" method="post" th:action="@{/admin/accounts/toggle}"
                                      onsubmit="return confirm('确定要切换该账号的启用状态吗？');">
                                    <input type="hidden" name="userId" th:value="${a.userId}">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${a.enabled == 1} ? 'btn-outline-danger' : 'btn-outline-success'"
                                            th:disabled="${a.userType == 'ADMIN'}"
                                            th:text="${a.enabled == 1} ? '禁用' : '启用'">禁用</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="hint mt-2" th:if="${#lists.isEmpty(accounts)}">暂无账号，请先创建。</p>
            </div>
        </div>
    </div>
</main>

<script>
    function toggleType() {
        var type = document.getElementById('userType').value;
        var studentSelect = document.getElementById('refIdStudent');
        var instructorSelect = document.getElementById('refIdInstructor');
        var isStudent = (type === 'STUDENT');
        studentSelect.style.display = isStudent ? '' : 'none';
        instructorSelect.style.display = isStudent ? 'none' : '';
        studentSelect.disabled = !isStudent;
        instructorSelect.disabled = isStudent;
    }
</script>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
