<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('先修管理')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container-fluid admin-shell px-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <aside th:replace="admin/_fragments :: adminNav('prereqs')"></aside>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="admin-content p-4">
                <h1 class="page-title">先修管理</h1>
                <p class="text-secondary">维护课程先修关系（自动检测成环）</p>

                <div class="alert alert-success py-2 mt-3" th:if="${success}" th:text="${success}">成功提示</div>
                <div class="alert alert-danger py-2 mt-3" th:if="${error}" th:text="${error}">错误提示</div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h2 class="h5">添加先修关系</h2>
                        <form method="post" th:action="@{/admin/prereqs}">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="courseId">课程</label>
                                    <select class="form-select" id="courseId" name="courseId" required>
                                        <option th:each="c : ${courses}" th:value="${c.courseId}"
                                                th:text="${c.courseId} + ' - ' + ${c.title}">课程</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="prereqId">先修课程</label>
                                    <select class="form-select" id="prereqId" name="prereqId" required>
                                        <option th:each="c : ${courses}" th:value="${c.courseId}"
                                                th:text="${c.courseId} + ' - ' + ${c.title}">先修课程</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary">添加</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive bg-white border rounded-3 shadow-sm mt-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>课程</th><th>先修课程</th><th class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${prereqs}">
                            <td>
                                <span th:text="${p.courseId}">课程号</span>
                                <span class="dim" th:text="${p.courseTitle}">课程名</span>
                            </td>
                            <td>
                                <span th:text="${p.prereqId}">先修课程号</span>
                                <span class="dim" th:text="${p.prereqTitle}">先修课程名</span>
                            </td>
                            <td class="text-end">
                                <form class="d-inline" method="post" th:action="@{/admin/prereqs/delete}"
                                      onsubmit="return confirm('确定删除该先修关系吗？');">
                                    <input type="hidden" name="courseId" th:value="${p.courseId}">
                                    <input type="hidden" name="prereqId" th:value="${p.prereqId}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="hint mt-2" th:if="${#lists.isEmpty(prereqs)}">暂无先修关系。</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
