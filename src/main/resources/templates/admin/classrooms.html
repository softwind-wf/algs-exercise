<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('教室管理')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container-fluid admin-shell px-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <aside th:replace="admin/_fragments :: adminNav('classrooms')"></aside>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="admin-content p-4">
                <h1 class="page-title">教室管理</h1>
                <p class="text-secondary">维护教学楼、教室号与容量</p>

                <div class="alert alert-success py-2 mt-3" th:if="${success}" th:text="${success}">成功提示</div>
                <div class="alert alert-danger py-2 mt-3" th:if="${error}" th:text="${error}">错误提示</div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h2 class="h5" th:text="${editClassroom != null} ? '编辑教室' : '新增教室'">新增教室</h2>
                        <form method="post" th:action="@{${editClassroom != null} ? '/admin/classrooms/update' : '/admin/classrooms'}">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="building">教学楼</label>
                                    <input class="form-control" type="text" id="building" name="building"
                                           th:value="${editClassroom != null} ? ${editClassroom.building}"
                                           th:readonly="${editClassroom != null}" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="roomNumber">教室号</label>
                                    <input class="form-control" type="text" id="roomNumber" name="roomNumber"
                                           th:value="${editClassroom != null} ? ${editClassroom.roomNumber}"
                                           th:readonly="${editClassroom != null}" required>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-1" for="capacity">容量</label>
                                    <input class="form-control" type="number" min="1" id="capacity" name="capacity"
                                           th:value="${editClassroom != null} ? ${editClassroom.capacity}" required>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="${editClassroom != null} ? '保存修改' : '创建'">创建</button>
                                    <a class="btn btn-outline-secondary" th:if="${editClassroom != null}"
                                       th:href="@{/admin/classrooms}">取消</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive bg-white border rounded-3 shadow-sm mt-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>教学楼</th><th>教室号</th><th class="text-end">容量</th><th class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${classrooms}">
                            <td th:text="${c.building}">楼</td>
                            <td th:text="${c.roomNumber}">教室号</td>
                            <td class="text-end" th:text="${c.capacity}">容量</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/admin/classrooms(building=${c.building}, roomNumber=${c.roomNumber})}">编辑</a>
                                <form class="d-inline" method="post" th:action="@{/admin/classrooms/delete}"
                                      onsubmit="return confirm('确定删除该教室吗？');">
                                    <input type="hidden" name="building" th:value="${c.building}">
                                    <input type="hidden" name="roomNumber" th:value="${c.roomNumber}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="hint mt-2" th:if="${#lists.isEmpty(classrooms)}">暂无教室，请先新增。</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
