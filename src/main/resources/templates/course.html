<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('课程详情')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="detail-hero mt-3">
        <img th:src="@{/images/depts/{slug}.jpg(slug=${#strings.replace(#strings.replace(detail.course.deptName, '.', ''), ' ', '')})}"
             th:alt="${detail.course.title}">
        <div class="detail-hero-overlay">
            <h1 th:text="${detail.course.title}">课程名</h1>
            <div class="detail-hero-meta">
                <span th:text="${detail.course.courseId}">课程号</span>
                <span th:text="${detail.course.deptName}">系</span>
                <span th:text="${detail.course.credits} + ' 学分'">学分</span>
            </div>
        </div>
    </div>

    <h2 class="h5 mt-4">先修课程</h2>
    <ul class="list-group mb-3" th:if="${!#lists.isEmpty(detail.prereqs)}">
        <li class="list-group-item" th:each="p : ${detail.prereqs}">
            <a th:href="@{/courses/{id}(id=${p.courseId})}" th:text="${p.courseId}">课程号</a>
            <span class="dim" th:text="' - ' + ${p.title}">课程名</span>
        </li>
    </ul>
    <p class="hint" th:unless="${!#lists.isEmpty(detail.prereqs)}">无先修课程。</p>

    <h2 class="h5 mt-4">开课班（<span th:text="${detail.sections.size()}">0</span>）</h2>
    <div class="row g-4">
        <div class="col-md-6" th:each="s : ${detail.sections}">
            <a class="list-card" th:href="@{/sections/{courseId}/{secId}/{semester}/{year}(courseId=${s.courseId}, secId=${s.secId}, semester=${s.semester}, year=${s.year})}">
                <div class="list-card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                        <h3 class="list-card-title mb-0" th:text="'开课班 ' + ${s.secId}">开课班</h3>
                        <span class="section-term" th:text="${s.year} + ' ' + ${s.semester}">学期</span>
                    </div>
                    <div class="list-card-meta mb-3">
                        <span th:text="'教室 ' + ${s.building + ' ' + s.roomNumber}">教室</span>
                        <span th:text="'时段 ' + ${s.timeSlotId}">时段</span>
                        <span th:text="'教师 ' + ${s.instructorNames}">教师</span>
                    </div>
                    <div class="enroll-bar">
                        <div class="enroll-bar-track">
                            <div class="enroll-bar-fill"
                                 th:style="${'width:' + ((s.capacity != null and s.capacity > 0 and s.enrolled != null) ? (s.enrolled * 100 / s.capacity) : 0) + '%'}"></div>
                        </div>
                        <span class="enroll-text" th:text="${s.enrolled} + ' / ' + ${s.capacity} + ' 人'">选课</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <p class="hint" th:if="${#lists.isEmpty(detail.sections)}">暂无开课班。</p>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
