<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('无权访问')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <div class="card login-card shadow-sm mt-5">
        <div class="card-body p-4 text-center">
            <div class="error-code">403</div>
            <h1 class="h4 mb-3">无权访问</h1>
            <div class="alert alert-danger py-2 text-start" th:if="${message}" th:text="${message}">错误信息</div>
            <p class="text-muted mb-3" th:unless="${message}">当前账号没有权限访问该页面，请使用具备相应角色的账号登录。</p>
            <div class="d-flex justify-content-center gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/}">返回首页</a>
                <a class="btn btn-primary" th:href="@{/login}">去登录</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
