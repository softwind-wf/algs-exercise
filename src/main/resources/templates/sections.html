<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('开课班')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container">
    <h1 class="page-title">开课班</h1>

    <form method="get" th:action="@{/sections}" class="filter-card p-3 mt-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label mb-1" for="semester">学期</label>
                <select class="form-select" id="semester" name="semester">
                    <option value="">全部</option>
                    <option value="Fall" th:selected="${semester == 'Fall'}">Fall</option>
                    <option value="Spring" th:selected="${semester == 'Spring'}">Spring</option>
                    <option value="Summer" th:selected="${semester == 'Summer'}">Summer</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label mb-1" for="year">年份</label>
                <input class="form-control" type="number" id="year" name="year"
                       th:value="${year}" placeholder="如 2010" min="1900" max="2100">
            </div>
            <div class="col-auto">
                <label class="form-label mb-1" for="courseId">课程</label>
                <select class="form-select" id="courseId" name="courseId">
                    <option value="">全部</option>
                    <option th:each="c : ${courses}" th:value="${c.courseId}"
                            th:selected="${courseId == c.courseId}"
                            th:text="${c.courseId} + ' ' + ${c.title}">课程</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">查询</button>
            </div>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="s : ${sections.records}">
            <a class="list-card" th:href="@{/sections/{courseId}/{secId}/{semester}/{year}(courseId=${s.courseId}, secId=${s.secId}, semester=${s.semester}, year=${s.year})}">
                <div class="list-card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                        <h2 class="list-card-title mb-0" th:text="${s.courseTitle}">课程名</h2>
                        <span class="section-term" th:text="${s.year} + ' ' + ${s.semester}">学期</span>
                    </div>
                    <p class="list-card-sub mb-2" th:text="${s.courseId} + ' · 开课号 ' + ${s.secId}">课程号</p>
                    <div class="list-card-meta mb-3">
                        <span th:text="'教室 ' + ${s.building + ' ' + s.roomNumber}">教室</span>
                        <span th:text="'时段 ' + ${s.timeSlotId}">时段</span>
                        <span th:text="'教师 ' + ${s.instructorNames}">教师</span>
                    </div>
                    <div class="enroll-bar">
                        <div class="enroll-bar-track">
                            <div class="enroll-bar-fill"
                                 th:style="${'width:' + ((s.capacity != null and s.capacity > 0 and s.enrolled != null) ? (s.enrolled * 100 / s.capacity) : 0) + '%'}"></div>
                        </div>
                        <span class="enroll-text" th:text="${s.enrolled} + ' / ' + ${s.capacity} + ' 人'">选课</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <p class="hint mt-3" th:if="${#lists.isEmpty(sections.records)}">没有符合条件的开课班。</p>

    <div class="d-flex flex-wrap align-items-center justify-content-between mt-3 gap-2">
        <p class="hint mb-0" th:if="${sections.total > 0}">
            共 <span th:text="${sections.total}">0</span> 条，第 <span th:text="${sections.page}">1</span> / <span th:text="${sections.totalPages}">1</span> 页
        </p>
        <nav th:if="${sections.totalPages > 1}" aria-label="分页">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!sections.hasPrev} ? 'disabled'">
                    <a class="page-link" th:href="@{/sections(page=${sections.prevPage}, semester=${semester}, year=${year}, courseId=${courseId})}">上一页</a>
                </li>
                <li class="page-item" th:each="n : ${sections.pageNumbers}"
                    th:classappend="${n == 0 ? 'disabled' : (n == sections.page ? 'active' : '')}">
                    <span class="page-link" th:if="${n == 0}">…</span>
                    <a class="page-link" th:unless="${n == 0}"
                       th:href="@{/sections(page=${n}, semester=${semester}, year=${year}, courseId=${courseId})}"
                       th:text="${n}">1</a>
                </li>
                <li class="page-item" th:classappend="${!sections.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{/sections(page=${sections.nextPage}, semester=${semester}, year=${year}, courseId=${courseId})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
