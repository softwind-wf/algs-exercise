<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('登录')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>

<main class="container narrow">
    <h1>用户登录</h1>
    <div class="alert" th:if="${error}" th:text="${error}">错误提示</div>
    <form method="post" th:action="@{/login}">
        <label>账号
            <input type="text" name="userId" th:value="${userId}" required autofocus>
        </label>
        <label>密码
            <input type="password" name="password" required>
        </label>
        <button type="submit">登录</button>
    </form>
    <p class="hint">演示账号：zhang / katz / admin，密码均为 password</p>
</main>

<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
